[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.0"

# Astro fingerprints everything in /_astro/, so a changed file always gets a new name.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Then-pictures keep their names when re-cropped, so cache them for a week only.
[[headers]]
  for = "/then/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
